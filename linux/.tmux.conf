unbind C-b
set -g prefix `
bind ` send-prefix

# Mouse support (click panes, drag borders)
set -g mouse on

# Start window/pane numbering at 1 (nicer than 0)
set -g base-index 1
setw -g pane-base-index 1

# --- Option/Alt bindings, no prefix needed ---

# Windows (tabs)
bind -n M-n new-window
bind -n M-m next-window
bind -n M-b previous-window
bind -n M-w kill-window

# Panes (splits)
bind -n M-e split-window -h -c "#{pane_current_path}"   # vertical split (side by side)
bind -n M-o split-window -v -c "#{pane_current_path}"    # horizontal split (stacked)
bind -n M-x kill-pane

# Move between panes
#bind -n M-Left select-pane -L
#bind -n M-Down select-pane -D
#bind -n M-Up select-pane -U
#bind -n M-Right select-pane -R

# vim-tmux-navigator (for linux vm)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -n "C-\\" if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi "C-\\" select-pane -l

# Resize panes
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

# Detach session
bind -n M-d detach

set -g status-right ""

# Copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Reload config quickly
bind -n M-r source-file ~/.tmux.conf \; display "Reloaded!"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'

set -g @catppuccin_flavour 'mocha'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Color correction
set-option -sa terminal-overrides ",xterm*:Tc"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
