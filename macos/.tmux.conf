unbind C-b
set -g prefix `
bind ` send-prefix

# Mouse support (click panes, drag borders)
set -g mouse on

# Start window/pane numbering at 1 (nicer than 0)
set -g base-index 1
setw -g pane-base-index 1

# --- Option/Alt bindings, no prefix needed ---

# Windows (tabs)
bind -n M-n new-window
bind -n M-m next-window
bind -n M-b previous-window
bind -n M-w kill-window

# Panes (splits)
bind -n M-e split-window -h -c "#{pane_current_path}"   # vertical split (side by side)
bind -n M-o split-window -v -c "#{pane_current_path}"    # horizontal split (stacked)
bind -n M-x kill-pane

# Move between panes
#bind -n M-Left select-pane -L
#bind -n M-Down select-pane -D
#bind -n M-Up select-pane -U
#bind -n M-Right select-pane -R

# Resize panes
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

# Detach session
bind -n M-d detach

# Copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Reload config quickly
bind -n M-r source-file ~/.tmux.conf \; display "Reloaded!"

set -g @catppuccin_flavour 'mocha'
set -g @catppuccin_window_current_fill "all"
set -g status-right "#{E:@catppuccin_status_directory}"
set -agF status-right "#{E:@catppuccin_status_session}"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Color correction
set-option -sa terminal-overrides ",xterm*:Tc"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
